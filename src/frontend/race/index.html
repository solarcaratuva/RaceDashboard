<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>RaceDashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              uva: {
                orange: 'var(--uva-orange)',
                blue: 'var(--uva-blue)',
                navy: 'var(--uva-navy)'
              },
              slate: {
                100: '#f5f6f7',
                200: '#e9ebee',
                300: '#d3d7dd',
                400: '#8a92a0',
                500: '#687386',
                600: '#4b566b',
                700: '#344158',
                800: '#232d4b',
                900: '#17213a'
              },
              emerald: {
                400: 'var(--uva-blue)',
                500: 'var(--uva-blue)',
                600: 'var(--uva-blue)'
              },
              amber: {
                400: 'var(--uva-orange)',
                500: 'var(--uva-orange)',
                600: 'var(--uva-orange)'
              },
              orange: {
                600: 'var(--uva-orange)'
              },
              blue: {
                500: 'var(--uva-blue)',
                600: 'var(--uva-blue)'
              },
              cyan: {
                400: 'var(--uva-blue)'
              },
              purple: {
                500: 'var(--uva-blue)',
                400: 'var(--uva-blue)'
              },
              rose: {
                400: 'var(--uva-orange)',
                500: 'var(--uva-orange)'
              }
            },
            fontFamily: {
              sans: ['Manrope', 'Arial', 'sans-serif'],
              mono: ['JetBrains Mono', 'Consolas', 'monospace']
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
